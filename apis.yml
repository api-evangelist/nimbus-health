description: Nimbus Health is a technology-enabled network of outpatient pulmonary
  care clinics treating chronic respiratory disease. Founded in 2022, it acquires
  and unifies established pulmonary practices onto a shared clinical and operational
  platform, operating eight clinics across Arizona, Georgia, and South Carolina and
  serving more than thirty thousand patients with care for COPD, asthma, interstitial
  lung disease, pulmonary fibrosis, bronchiectasis, sleep apnea, and chronic cough.
  It is backed by 8VC, 2048 Ventures, and General Catalyst. No public developer API,
  documentation, or developer portal surface was found during enrichment; this profile
  captures company identity and domain-security posture as a portfolio lead.
